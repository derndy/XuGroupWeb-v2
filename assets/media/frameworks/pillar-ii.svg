<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">From an evidence gap to a verified update</title>
<desc id="desc">Results inform the next evidence choice. Conceptual framework, not an experimental result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08736c"/></marker></defs>
<rect width="900" height="460" rx="20" fill="#f4f8fc"/>
<path d="M 260 84 H 332" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 560 84 H 632" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 750 132 V 308" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 640 364 H 268" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 150 316 V 140" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="40" y="36" width="220" height="96" rx="12" fill="white" stroke="#08736c" stroke-width="1.5"/>
<circle cx="62" cy="58" r="12" fill="#08736c"/>
<text x="62" y="63" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="62" dy="0">1</tspan>
</text>
<text x="150.0" y="85" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="150.0" dy="0">Decision context</tspan>
</text>
<rect x="340" y="36" width="220" height="96" rx="12" fill="white" stroke="#08736c" stroke-width="1.5"/>
<circle cx="362" cy="58" r="12" fill="#08736c"/>
<text x="362" y="63" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="362" dy="0">2</tspan>
</text>
<text x="450.0" y="85" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="450.0" dy="0">Evidence quality</tspan>
</text>
<rect x="640" y="36" width="220" height="96" rx="12" fill="white" stroke="#08736c" stroke-width="1.5"/>
<circle cx="662" cy="58" r="12" fill="#08736c"/>
<text x="662" y="63" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="662" dy="0">3</tspan>
</text>
<text x="750.0" y="85" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="750.0" dy="0">Competing</tspan>
<tspan x="750.0" dy="25">hypotheses</tspan>
</text>
<rect x="640" y="316" width="220" height="96" rx="12" fill="white" stroke="#08736c" stroke-width="1.5"/>
<circle cx="662" cy="338" r="12" fill="#08736c"/>
<text x="662" y="343" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="662" dy="0">4</tspan>
</text>
<text x="750.0" y="365" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="750.0" dy="0">Acquire or</tspan>
<tspan x="750.0" dy="25">create</tspan>
</text>
<rect x="40" y="316" width="220" height="96" rx="12" fill="white" stroke="#08736c" stroke-width="1.5"/>
<circle cx="62" cy="338" r="12" fill="#08736c"/>
<text x="62" y="343" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="62" dy="0">5</tspan>
</text>
<text x="150.0" y="365" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="150.0" dy="0">Measure and</tspan>
<tspan x="150.0" dy="25">update</tspan>
</text>
<text x="450" y="212" text-anchor="middle" fill="#08736c" font-family="Arial, sans-serif" font-size="23" font-weight="600">
<tspan x="450" dy="0">Evidence informs the next</tspan>
<tspan x="450" dy="25">choice</tspan>
</text>
</svg>
