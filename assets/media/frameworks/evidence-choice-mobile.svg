<text x="220.0" y="718.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Compare differences</text>
<text x="220.0" y="746.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">against uncertainty</text>
<path d="M220 765 V796 H112 V827" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M220 796 H328 V827" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="17" y="835" width="190" height="135" rx="12" fill="white" stroke="#08736c" stroke-width="1.6"/>
<text x="112.0" y="867.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Informative</text>
<text x="112.0" y="895.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Reweight</text>
<text x="112.0" y="923.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">the competing</text>
<text x="112.0" y="951.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">explanations</text>
<rect x="233" y="835" width="190" height="135" rx="12" fill="white" stroke="#7142a5" stroke-width="1.6"/>
<text x="328.0" y="867.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Ambiguous</text>
<text x="328.0" y="895.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Revise or</text>
<text x="328.0" y="923.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">choose the</text>
<text x="328.0" y="951.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">next test</text>
<text x="220" y="1030" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#40576e">Either outcome informs the next choice.</text>
<text x="220" y="1070" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#40576e">Conceptual example · No measured data</text>
</svg>
