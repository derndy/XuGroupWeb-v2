<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1130" viewBox="0 0 440 1130" role="img" aria-labelledby="title desc">
<title id="title">Choose evidence that separates explanations</title>
<desc id="desc">Two explanations fit current observations. Choose a feasible perturbation with differing predictions, measure with controls, and assess the difference against uncertainty. Update the explanations or choose another test if the result remains ambiguous. Conceptual example, not experimental data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#08736c"/></marker></defs>
<rect width="440" height="1130" rx="18" fill="#f4f8fc"/>
<rect x="55" y="24" width="330" height="80" rx="12" fill="white" stroke="#08736c" stroke-width="1.6"/>
<text x="220.0" y="71.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Current observations</text>
<path d="M220 104 V124 H112 V145" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M220 124 H328 V145" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="17" y="153" width="190" height="108" rx="12" fill="white" stroke="#08736c" stroke-width="1.6"/>
<text x="112.0" y="186.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Explanation A</text>
<text x="112.0" y="214.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Fits what</text>
<text x="112.0" y="242.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">we know</text>
<rect x="233" y="153" width="190" height="108" rx="12" fill="white" stroke="#08736c" stroke-width="1.6"/>
<text x="328.0" y="186.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Explanation B</text>
<text x="328.0" y="214.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Fits what</text>
<text x="328.0" y="242.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">we know</text>
<path d="M112 261 V288 H220 V315" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M328 261 V288 H220" fill="none" stroke="#08736c" stroke-width="2.5"/>
<rect x="55" y="323" width="330" height="108" rx="12" fill="white" stroke="#08736c" stroke-width="1.6"/>
<text x="220.0" y="356.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Choose a perturbation</text>
<text x="220.0" y="384.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Feasible test with</text>
<text x="220.0" y="412.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">different predictions</text>
<path d="M220 431 V453 H112 V480" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M220 453 H328 V480" fill="none" stroke="#08736c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="17" y="488" width="190" height="108" rx="12" fill="white" stroke="#08736c" stroke-width="1.6"/>
<text x="112.0" y="521.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Prediction A</text>
<text x="112.0" y="549.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Expected</text>
<text x="112.0" y="577.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">response A</text>
<rect x="233" y="488" width="190" height="108" rx="12" fill="white" stroke="#08736c" stroke-width="1.6"/>
<text x="328.0" y="521.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="650" fill="#132d4c">Prediction B</text>
<text x="328.0" y="549.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Expected</text>
<text x="328.0" y="577.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">response B</text>
