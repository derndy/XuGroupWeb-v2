<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">From a scientific bottleneck to a testable method</title>
<desc id="desc">Stress tests can lead us to revisit assumptions. Conceptual framework, not an experimental result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7142a5"/></marker></defs>
<rect width="900" height="460" rx="20" fill="#f4f8fc"/>
<path d="M 260 84 H 332" fill="none" stroke="#7142a5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 560 84 H 632" fill="none" stroke="#7142a5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 750 132 V 308" fill="none" stroke="#7142a5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 640 364 H 268" fill="none" stroke="#7142a5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 640 342 H 450 V 140" fill="none" stroke="#7142a5" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="40" y="36" width="220" height="96" rx="12" fill="white" stroke="#7142a5" stroke-width="1.5"/>
<circle cx="62" cy="58" r="12" fill="#7142a5"/>
<text x="62" y="63" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="62" dy="0">1</tspan>
</text>
<text x="150.0" y="85" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="150.0" dy="0">Scientific</tspan>
<tspan x="150.0" dy="25">bottleneck</tspan>
</text>
<rect x="340" y="36" width="220" height="96" rx="12" fill="white" stroke="#7142a5" stroke-width="1.5"/>
<circle cx="362" cy="58" r="12" fill="#7142a5"/>
<text x="362" y="63" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="362" dy="0">2</tspan>
</text>
<text x="450.0" y="85" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="450.0" dy="0">Abstraction and</tspan>
<tspan x="450.0" dy="25">assumptions</tspan>
</text>
<rect x="640" y="36" width="220" height="96" rx="12" fill="white" stroke="#7142a5" stroke-width="1.5"/>
<circle cx="662" cy="58" r="12" fill="#7142a5"/>
<text x="662" y="63" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="662" dy="0">3</tspan>
</text>
<text x="750.0" y="85" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="750.0" dy="0">Method or</tspan>
<tspan x="750.0" dy="25">algorithm</tspan>
</text>
<rect x="640" y="316" width="220" height="96" rx="12" fill="white" stroke="#7142a5" stroke-width="1.5"/>
<circle cx="662" cy="338" r="12" fill="#7142a5"/>
<text x="662" y="343" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="662" dy="0">4</tspan>
</text>
<text x="750.0" y="365" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="750.0" dy="0">Stress test and</tspan>
<tspan x="750.0" dy="25">uncertainty</tspan>
</text>
<rect x="40" y="316" width="220" height="96" rx="12" fill="white" stroke="#7142a5" stroke-width="1.5"/>
<circle cx="62" cy="338" r="12" fill="#7142a5"/>
<text x="62" y="343" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="62" dy="0">5</tspan>
</text>
<text x="150.0" y="365" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="150.0" dy="0">New constraint</tspan>
<tspan x="150.0" dy="25">or possibility</tspan>
</text>
<text x="260" y="212" text-anchor="middle" fill="#7142a5" font-family="Arial, sans-serif" font-size="23" font-weight="600">
<tspan x="260" dy="0">Revisit assumptions</tspan>
</text>
<text x="260" y="267" text-anchor="middle" fill="#40576e" font-family="Arial, sans-serif" font-size="18" font-weight="400">
<tspan x="260" dy="0">Dashed path: feedback from</tspan>
<tspan x="260" dy="25">stress tests</tspan>
</text>
</svg>
