<text x="64" y="238" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">3</text>
<line x1="330" y1="418" x2="330" y2="170" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<line x1="82" y1="170" x2="330" y2="170" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
