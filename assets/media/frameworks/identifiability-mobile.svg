<line x1="82" y1="846" x2="330" y2="846" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<text x="144" y="934" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">1</text>
