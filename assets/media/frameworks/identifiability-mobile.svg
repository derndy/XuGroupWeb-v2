<text x="220.0" y="509" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#132d4c">Three example pairs are marked.</text>
<rect x="16" y="548" width="408" height="470" rx="14" fill="white" stroke="#cbd8e8"/>
<text x="220.0" y="586" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#132d4c">Two measurements</text>
<text x="220.0" y="620" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#245ca8">a + b = 4; a − b = 2</text>
