<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1120" viewBox="0 0 440 1120" role="img" aria-labelledby="title desc">
<title id="title">A good fit need not identify a unique explanation.</title>
<desc id="desc">For a and b between zero and four, the exact measurement a plus b equals four leaves a line of possible pairs. Adding the independent exact measurement a minus b equals two leaves the unique intersection (3,1). Illustrative linear model with exact measurements, not experimental evidence.</desc>
<rect width="440" height="1120" rx="18" fill="#f4f8fc"/>
<text x="220" y="36" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#132d4c">What can the data identify?</text>
<rect x="16" y="58" width="408" height="470" rx="14" fill="white" stroke="#cbd8e8"/>
<text x="220.0" y="96" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#132d4c">One measurement</text>
<text x="220.0" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#245ca8">a + b = 4</text>
<line x1="82" y1="418" x2="82" y2="170" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
