<text x="268" y="934" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">3</text>
<text x="64" y="728" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">3</text>
<line x1="330" y1="908" x2="330" y2="660" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<line x1="82" y1="660" x2="330" y2="660" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<text x="330" y="934" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">4</text>
<text x="64" y="666" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">4</text>
