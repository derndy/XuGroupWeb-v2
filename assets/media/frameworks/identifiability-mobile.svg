<text x="144" y="444" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">1</text>
<text x="64" y="362" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">1</text>
<line x1="206" y1="418" x2="206" y2="170" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<line x1="82" y1="294" x2="330" y2="294" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<text x="206" y="444" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">2</text>
<text x="64" y="300" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">2</text>
