<text x="60" y="646.36" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#132d4c">b</text>
<line x1="82" y1="660" x2="330" y2="908" stroke="#245ca8" stroke-width="4" stroke-dasharray=""/>
<line x1="206" y1="908" x2="330" y2="784" stroke="#08736c" stroke-width="4" stroke-dasharray="9 6"/>
<circle cx="268" cy="846" r="8" fill="#132d4c" stroke="white" stroke-width="2"/>
<text x="326" y="853" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#132d4c">(3, 1)</text>
