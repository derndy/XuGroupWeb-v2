<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">Same units. Different relationships.</title>
<desc id="desc">Two graphs have the same scalar features, 1, 2, 3 and 4, and the same feature mean, 2.5. Graph A connects 1 to 2 and 3 to 4. Graph B connects 1 to 3 and 2 to 4. The sum of connected-pair products is 14 for A and 11 for B. Illustrative calculation, not measured data.</desc>
<rect x="0" y="0" width="960" height="700" rx="18" fill="#f4f8fc" stroke="#f4f8fc" stroke-width="1.5"/>
<rect x="24" y="24" width="912" height="90" rx="14" fill="#eaf0f9" stroke="#cbd8e8" stroke-width="1.5"/>
<text x="480" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#132d4c">Same feature values: 1, 2, 3, 4</text>
<text x="480" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#40576e">Feature mean in both graphs: (1 + 2 + 3 + 4) / 4 = 2.5</text>
<rect x="24" y="140" width="448" height="450" rx="14" fill="white" stroke="#cbd8e8" stroke-width="1.5"/>
<text x="248.0" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#245ca8">Graph A</text>
<line x1="148.0" y1="254" x2="348.0" y2="254" stroke="#245ca8" stroke-width="5"/>
<line x1="148.0" y1="376" x2="348.0" y2="376" stroke="#245ca8" stroke-width="5"/>
<circle cx="148.0" cy="254" r="29" fill="white" stroke="#245ca8" stroke-width="3"/>
<text x="148.0" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#245ca8">1</text>
<circle cx="348.0" cy="254" r="29" fill="white" stroke="#245ca8" stroke-width="3"/>
<text x="348.0" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#245ca8">2</text>
<circle cx="148.0" cy="376" r="29" fill="white" stroke="#245ca8" stroke-width="3"/>
<text x="148.0" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#245ca8">3</text>
<circle cx="348.0" cy="376" r="29" fill="white" stroke="#245ca8" stroke-width="3"/>
<text x="348.0" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#245ca8">4</text>
<text x="248.0" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#40576e">Add connected-pair products</text>
<text x="248.0" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#132d4c">(1 × 2) + (3 × 4)</text>
<rect x="161.0" y="505" width="174" height="52" rx="26" fill="#edf4fc" stroke="#245ca8" stroke-width="1.5"/>
<text x="248.0" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#245ca8">Result: 14</text>
<rect x="488" y="140" width="448" height="450" rx="14" fill="white" stroke="#cbd8e8" stroke-width="1.5"/>
<text x="712.0" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#08736c">Graph B</text>
<line x1="612.0" y1="254" x2="612.0" y2="376" stroke="#08736c" stroke-width="5"/>
<line x1="812.0" y1="254" x2="812.0" y2="376" stroke="#08736c" stroke-width="5"/>
<circle cx="612.0" cy="254" r="29" fill="white" stroke="#08736c" stroke-width="3"/>
<text x="612.0" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#08736c">1</text>
<circle cx="812.0" cy="254" r="29" fill="white" stroke="#08736c" stroke-width="3"/>
<text x="812.0" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#08736c">2</text>
<circle cx="612.0" cy="376" r="29" fill="white" stroke="#08736c" stroke-width="3"/>
<text x="612.0" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#08736c">3</text>
<circle cx="812.0" cy="376" r="29" fill="white" stroke="#08736c" stroke-width="3"/>
<text x="812.0" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#08736c">4</text>
<text x="712.0" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#40576e">Add connected-pair products</text>
<text x="712.0" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#132d4c">(1 × 3) + (2 × 4)</text>
<rect x="625.0" y="505" width="174" height="52" rx="26" fill="#e9f6f3" stroke="#08736c" stroke-width="1.5"/>
<text x="712.0" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#08736c">Result: 11</text>
<text x="480" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#132d4c">Connections change what is combined.</text>
<text x="480" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#40576e">Toy calculation · No measured data</text>
</svg>
