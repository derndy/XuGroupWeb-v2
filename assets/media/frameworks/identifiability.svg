<text x="152" y="506" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">1</text>
<text x="72" y="424" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">1</text>
<line x1="214" y1="480" x2="214" y2="232" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<line x1="90" y1="356" x2="338" y2="356" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
<text x="214" y="506" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">2</text>
<text x="72" y="362" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#132d4c">2</text>
<line x1="276" y1="480" x2="276" y2="232" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
