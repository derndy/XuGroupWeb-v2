<text x="248.0" y="538" font-family="Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#132d4c">Every point on the blue line fits.</text>
<text x="248.0" y="571" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#132d4c">Three example pairs are marked.</text>
<rect x="488" y="120" width="448" height="470" rx="14" fill="white" stroke="#cbd8e8"/>
<text x="712.0" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#132d4c">Two measurements</text>
<text x="712.0" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#245ca8">a + b = 4; a − b = 2</text>
