<line x1="90" y1="480" x2="353.5" y2="480" stroke="#132d4c" stroke-width="2" stroke-dasharray=""/>
<line x1="90" y1="480" x2="90" y2="216.5" stroke="#132d4c" stroke-width="2" stroke-dasharray=""/>
<text x="369.0" y="487" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#132d4c">a</text>
<text x="68" y="218.36" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#132d4c">b</text>
<line x1="90" y1="232" x2="338" y2="480" stroke="#245ca8" stroke-width="4" stroke-dasharray=""/>
<circle cx="152" cy="294" r="7" fill="white" stroke="#245ca8" stroke-width="3"/>
