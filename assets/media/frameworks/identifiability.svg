<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">A good fit need not identify a unique explanation.</title>
<desc id="desc">For a and b between zero and four, the exact measurement a plus b equals four leaves a line of possible pairs. Adding the independent exact measurement a minus b equals two leaves the unique intersection (3,1). Illustrative linear model with exact measurements, not experimental evidence.</desc>
<rect width="960" height="700" rx="18" fill="#f4f8fc"/>
<text x="480" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#132d4c">A good fit is not always a unique answer.</text>
<text x="480" y="91" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#132d4c">The second measurement adds a different constraint.</text>
<rect x="24" y="120" width="448" height="470" rx="14" fill="white" stroke="#cbd8e8"/>
<text x="248.0" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#132d4c">One measurement</text>
<text x="248.0" y="192" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#245ca8">a + b = 4</text>
<line x1="90" y1="480" x2="90" y2="232" stroke="#e0e7f0" stroke-width="1" stroke-dasharray=""/>
