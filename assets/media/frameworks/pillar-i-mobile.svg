</text>
<text x="200.0" y="729" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="200.0" dy="0">Testable mechanism</tspan>
</text>
<text x="200" y="827" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
