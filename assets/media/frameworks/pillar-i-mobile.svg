<tspan x="92" dy="0">1</tspan>
</text>
<text x="200.0" y="89" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="200.0" dy="0">Scientific</tspan>
<tspan x="200.0" dy="25">question</tspan>
</text>
<rect x="70" y="200" width="260" height="96" rx="12" fill="white" stroke="#165db5" stroke-width="1.5"/>
<circle cx="92" cy="222" r="12" fill="#165db5"/>
<text x="92" y="227" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="92" dy="0">2</tspan>
</text>
<text x="200.0" y="249" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="200.0" dy="0">Representation</tspan>
<tspan x="200.0" dy="25">space</tspan>
</text>
<rect x="70" y="360" width="260" height="96" rx="12" fill="white" stroke="#165db5" stroke-width="1.5"/>
<circle cx="92" cy="382" r="12" fill="#165db5"/>
<text x="92" y="387" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="92" dy="0">3</tspan>
</text>
<text x="200.0" y="409" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="200.0" dy="0">Interaction</tspan>
<tspan x="200.0" dy="25">structure</tspan>
</text>
<rect x="70" y="520" width="260" height="96" rx="12" fill="white" stroke="#165db5" stroke-width="1.5"/>
<circle cx="92" cy="542" r="12" fill="#165db5"/>
<text x="92" y="547" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">
<tspan x="92" dy="0">4</tspan>
</text>
<text x="200.0" y="569" text-anchor="middle" fill="#132d4c" font-family="Arial, sans-serif" font-size="20" font-weight="600">
<tspan x="200.0" dy="0">Learning dynamics</tspan>
</text>
<rect x="70" y="680" width="260" height="96" rx="12" fill="white" stroke="#165db5" stroke-width="1.5"/>
<circle cx="92" cy="702" r="12" fill="#165db5"/>
