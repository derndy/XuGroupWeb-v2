<svg xmlns="http://www.w3.org/2000/svg" width="400" height="900" viewBox="0 0 400 900" role="img" aria-labelledby="title desc">
<title id="title">From a scientific question to a testable mechanism</title>
<desc id="desc">Representation, interactions and learning are co-designed. Conceptual framework, not an experimental result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#165db5"/></marker></defs>
<rect width="400" height="900" rx="20" fill="#f4f8fc"/>
<rect x="42" y="182" width="316" height="450" rx="18" fill="#e8f0fc"/>
<path d="M 200 136 V 192" fill="none" stroke="#165db5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 200 296 V 352" fill="none" stroke="#165db5" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 200 456 V 512" fill="none" stroke="#165db5" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M 200 616 V 672" fill="none" stroke="#165db5" stroke-width="2.5" marker-end="url(#arrow)"/>
