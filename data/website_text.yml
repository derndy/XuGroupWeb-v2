# WEBSITE TEXT — public homepage and shared wording / 对外网站文字
# Audience: postdoctoral/PhD researchers, industry partners and research peers.
# Lead with recognisable fields, meaningful opportunities and scientific ambition.
# Keep research descriptions broad; avoid unpublished project designs or detailed roadmaps.
# Do not imply confirmed vacancies, funded positions, commercial results or released platforms.
# Edit wording here; preserve keys, indentation and stable concept/pillar ids.
# 修改文字即可；保留字段名、缩进与 id。首页按钮文字和目标链接也在此文件中。
# Shared entries also update connected About, Research and People sections.
# Individual records, approved image captions and other page copy keep their existing sources.
# Editing guide: docs/website-text-maintenance.md

