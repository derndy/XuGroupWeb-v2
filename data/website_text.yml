shared:
  grammar:
    dimensions:
      - id: "space"
        label: "Space"
        cue: "Molecular and multimodal representations"
        question: "How can AI learn the language of molecules and biology?"
        definition: >-
          Bring molecular structures, biological sequences and other scientific data into AI models that can
          connect information across formats and scales.
        relationship: "Richer representations help AI connect patterns in the data with the scientific relationships behind them."
        url: "/research/learning-system-design/"
        link_text: "Explore scientific AI"
      - id: "interaction"
        label: "Interaction"
        cue: "Connections across molecules and scales"
        question: "What connects molecular structure to biological function?"
        definition: >-
          Explore the relationships that shape molecular behaviour, biological function and material
          performance, from local interactions to larger-scale effects.
        relationship: >-
          Understanding these connections can inform predictions and suggest new directions for molecular and
          material design.
        url: "/research/learning-system-design/"
        link_text: "Explore molecular learning"
      - id: "learning"
        label: "Learning"
        cue: "Learning beyond familiar data"
        question: "How can AI remain useful when data are limited and conditions change?"
        definition: >-
          Develop learning methods that can make better use of scientific data and support prediction,
          exploration and design in new settings.
        relationship: >-
          We connect machine learning with scientific knowledge to study what transfers across systems and
          where new evidence is needed.
        url: "/research/learning-system-design/"
        link_text: "Explore scientific learning"
    evidence:
      id: "evidence"
      label: "Evidence"
      cue: "Data, experiments and new insight"
      definition: >-
        Connect AI with experimental insight to explore promising candidates, learn from new results and
        guide research decisions.
      url: "/research/evidence-engineering/"
      link_text: "Explore AI-guided discovery"
    aims:
      - id: "mechanism"
        label: "Mechanism"
        cue: "Understand the science behind the pattern"
        definition: >-
          Use AI alongside scientific reasoning and experimental evidence to investigate why molecules,
          materials and biological systems behave as they do.
        url: "/research/mathematical-frontiers/"
        link_text: "Explore mathematical discovery"
      - id: "design"
        label: "Design"
        cue: "Generative AI for molecules and materials"
        definition: >-
          Explore new molecular and material designs with desired properties, connecting generative AI and
          scientific knowledge with experimental evaluation.
        url: "/research/evidence-engineering/"
        link_text: "Explore generative design"
    feedback: "New results inspire better models, fresh questions and new possibilities for discovery."
  evidence_loop:
    introduction: "A conversation between AI and experiment."
    reading_note: "Every partnership starts with a scientific or R&D challenge."
    feedback_title: "Every result can open a new question."
    feedback: "Each result can sharpen a model, reveal a new question or suggest a more promising design."
    steps:
      - id: "observe"
        title: "Understand"
        summary: "Start with the scientific or R&D challenge."
        explanation: >-
          Discuss the system, available data and the outcome that would make a difference for the research
          team or partner.
        question: "What would a better prediction, candidate or decision make possible?"
        artifact: "A shared question and a focused research starting point."
        pillars:
          - "pillar-ii"
          - "pillar-iii"
      - id: "question"
        title: "Explore"
        summary: "Look for the opportunity in the data."
        explanation: >-
          Connect domain knowledge with data analysis to identify useful patterns, open questions and
          opportunities for AI.
        question: "Where could AI reveal something we cannot yet see?"
        artifact: "Ideas for models, analyses or candidate designs."
        pillars:
          - "pillar-i"
          - "pillar-iii"
      - id: "design-evidence"
        title: "Plan"
        summary: "Identify promising candidates and experiments."
        explanation: >-
          Explore how AI can help prioritise what to design, measure or test next, in conversation with
          experimental expertise.
        question: "Which candidate or experiment could move the project forward?"
        artifact: "A proposal for candidate selection or experimental study."
        pillars:
          - "pillar-ii"
          - "pillar-iii"
      - id: "learn"
        title: "Learn"
        summary: "Build insight from scientific data."
        explanation: "Develop and study AI methods that connect existing knowledge with new observations."
        question: "What can we learn about the properties or behaviour that matter?"
        artifact: "A model or analysis suited to the scientific question."
        pillars:
          - "pillar-i"
          - "pillar-ii"
      - id: "test"
        title: "Evaluate"
        summary: "Connect model performance with scientific value."
        explanation: >-
          Examine whether predictions and proposed designs remain useful under relevant conditions, with
          experimental evaluation where available.
        question: "Does the result help answer the question we set out to solve?"
        artifact: "An assessment of performance, scientific meaning and practical relevance."
        pillars:
          - "pillar-ii"
          - "pillar-iii"
      - id: "explain-design"
        title: "Discover"
        summary: "Open a new direction for research."
        explanation: >-
          Use the findings to shape new hypotheses, candidate designs or follow-on studies. The next advance
          may begin with a question the project was not asking before.
        question: "What new possibility does this result open?"
        artifact: "A research insight, candidate design or next-stage study."
        pillars:
          - "pillar-i"
          - "pillar-ii"
          - "pillar-iii"
  pillars:
    pillar-i:
      home_invitation: "Build AI that understands scientific systems."
      home_terms:
        - "Scientific foundation models"
        - "Multimodal learning"
        - "Molecular AI"
      role: "Models for scientific discovery"
      title: "Scientific AI & Multimodal Learning"
      question: "How can AI learn from complex scientific data and carry that knowledge into new settings?"
    pillar-ii:
      home_invitation: "Turn new ideas into better candidates."
      home_terms:
        - "Generative design"
        - "Active learning"
        - "AI for experimental design"
      role: "AI-guided R&D"
      title: "Generative Design & AI-Guided Discovery"
      question: "How can AI help us explore promising molecules, materials and experiments?"
    pillar-iii:
      home_invitation: "Make scientific AI more reliable and revealing."
      home_terms:
        - "Causal inference"
        - "Uncertainty quantification"
        - "Mathematical data science"
      role: "Principles for reliable AI"
      title: "Trustworthy AI & Mathematical Discovery"
      question: "How can we make AI more informative, reliable and useful for scientific decisions?"
  people_introduction: >-
    Our research brings together machine learning, mathematics, molecular science and biomedical
    engineering. Different perspectives help us see new questions and new ways to answer them.
