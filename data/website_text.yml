contact:
  hero:
    eyebrow: "Join / Collaborate"
    lead: "We welcome postdoctoral researchers, PhD candidates, academic collaborators and industry partners interested in scientific learning and intelligent systems."

  pathways:
    eyebrow: "Start a conversation"
    title: "Find a way to work together."
    lead: "A useful first conversation starts with the question you want to answer, the evidence available and the contribution you hope to make."
    navigation_label: "Ways to contact the lab"
    contact_details_label: "Contact details"
    contribution_label: "What you can bring"
    materials_label: "In your first email"
    next_step_label: "A possible next step"
    subject_label: "Suggested email subject"
    routes:
      - id: "scientific-collaboration"
        navigation_label: "Scientific collaboration"
        title: "Connect a question with a method."
        introduction: "For academic and industry teams exploring representation learning, model architectures, scientific data or the mathematical questions behind discovery."
        contribution: "Bring a well-defined question, your domain perspective and an idea of how progress could be assessed."
        materials:
          - "The scientific question and where current methods fall short."
          - "A short account of the evidence or theory available, with relevant public papers."
          - "The expertise you would contribute and the part you would like to explore together."
        next_step: "If the interests align, an initial discussion can narrow the question and identify a first joint task."
        email_subject: "Xu Lab | Scientific collaboration"
        email_label: "Email about collaboration"
        related_label: "Explore our research"
        related_url: "/research/"

      - id: "experimental-partnership"
        navigation_label: "Experimental partnership"
        title: "Turn a testbed into informative evidence."
        introduction: "For experimental teams working with molecular interactions, biomaterials, delivery systems, proteins, peptides or other demanding scientific systems."
        contribution: "Bring knowledge of what can be measured or perturbed, the practical constraints and the alternatives an experiment could distinguish."
        materials:
          - "The system, scientific question and decision the evidence should inform."
          - "Available measurements, controls and feasible perturbations, including important constraints."
          - "The experimental contribution you can make and the computational support you seek."
        next_step: "An exploratory discussion can define a useful measurement or pilot study and agree how its evidence would be assessed."
        email_subject: "Xu Lab | Experimental partnership"
        email_label: "Discuss an experimental partnership"
        related_label: "Explore evidence engineering"
        related_url: "/research/evidence-engineering/"

      - id: "join-the-lab"
        navigation_label: "Join the lab"
        title: "Bring curiosity and a question to pursue."
        introduction: "For postdoctoral researchers, PhD candidates and other prospective students interested in model architectures, learning algorithms, evidence acquisition, or the design of scientific and intelligent systems."
        research_space_label: "A direction you can help shape"
        research_space: "We welcome proposals whose central contribution is a new method or model architecture, developed through a scientific question. Tell us which direction you would like to shape and how it connects with our work."
        contribution: "Show how you approach a difficult question, learn unfamiliar methods and make your own contribution clear."
        materials:
          - "A brief introduction and CV, including the role or programme you are considering and your intended start date."
          - "A research question or direction that interests you and why it connects with the lab."
          - "One work sample you can share, such as a report, paper, code example or project summary, with your contribution explained."
        availability_label: "Ask about current opportunities"
        availability: "Please ask about openings, funding and application timing for your intended role or programme."
        next_step: "If there is a suitable opportunity, a discussion can explore the direction you want to develop, potential collaborators in the group, and the data, experimental or computational support a project would need."
        email_subject: "Xu Lab | Prospective researcher"
        email_label: "Enquire about joining the lab"
        related_label: "Meet the team"
        related_url: "/people/"

      - id: "research-asset-use"
        navigation_label: "Research asset use"
        title: "Build on a specific piece of work."
        introduction: "For readers with a question about a published paper or a research resource linked from it, including how to reproduce or extend a method."
        contribution: "Bring a precise use case and enough context to identify the relevant paper, resource or technical question."
        materials:
          - "The paper DOI or resource URL, and the version if one is provided."
          - "What you want to understand, reproduce or extend, and what you have already tried."
          - "A small example or exact error message when relevant; use material you are able to share."
        next_step: "A reply can clarify the relevant method or point to available material. Any access or reuse request depends on the specific resource and its terms."
        email_subject: "Xu Lab | Research asset enquiry"
        email_label: "Ask about a paper or resource"
        related_label: "Browse publications"
        related_url: "/publication/"

  closing:
    eyebrow: "Join / Collaborate"
    title: "Bring a scientific question worth stress-testing."

  information:
    eyebrow: "Primary contact"
    email_label: "Email"
    phone_label: "Phone"
    address_label: "Address"
    appointment_label: "Book an appointment"

  vision:
    eyebrow: "Our vision"
    title: "Understanding the World. Pioneering the Future."
    introduction: >-
      We seek to deepen our understanding of the world, recognise questions of growing importance,
      and cultivate researchers who can lead the future of their fields.
    perspectives:
      - title: "Scientific foresight"
        description: >-
          We look for early signals of change, connect developments across fields, see the structures
          behind phenomena, and question assumptions that limit our thinking. Our horizon spans decades and,
          where meaningful, centuries. What problems and constraints will become important?
          What knowledge could open new directions?
      - title: "Evidence and intellectual leadership"
        description: >-
          We follow evidence in pursuit of reality and truth, remaining ready to revise our understanding.
          Thinking about the future means stating assumptions and turning them into questions we can
          investigate today. Intellectual leadership grows from worthwhile questions and rigorous understanding.
    architects:
      title: "Cultivating domain intelligence system architects"
      introduction: >-
        One path is to cultivate domain intelligence system architects: researchers who connect model
        architecture, infrastructure, and the design of scientific and intelligent systems. Starting with
        worthwhile problems, they define objective functions (what to optimise), search spaces
        (what possibilities to explore), and evaluation criteria (how to judge progress).
      outlook: >-
        For example, asking how much effective intelligence can be produced per unit of energy could open
        a new direction in energy-efficient intelligence. Our vision leaves room for important problems
        and research methods that have yet to emerge.
shared:
  grammar:
    dimensions:
      - id: "space"
        label: "Space"
        cue: "Represent what matters"
        question: "What distinctions should the representation preserve?"
        definition: >-
          Organise scientific states, coordinates and scales so that relevant structure, symmetries and
          uncertainty can be represented.
        relationship: >-
          The chosen space shapes which interactions can be expressed; learning can reveal distinctions that
          require a different space.
        url: "/research/learning-system-design/"
        link_text: "Explore representation design"
      - id: "interaction"
        label: "Interaction"
        cue: "Expose meaningful relations"
        question: "Which relationships should the system expose?"
        definition: >-
          Design how information is exchanged, transformed and combined, from local relationships to
          collective and cross-scale effects.
        relationship: "Interactions depend on the representation and determine what information the learning process can combine."
        url: "/research/learning-system-design/"
        link_text: "Explore interaction design"
      - id: "learning"
        label: "Learning"
        cue: "Update from evidence"
        question: "What update process turns evidence into reusable knowledge?"
        definition: >-
          Design learning goals, feedback and constraints together to study how the system changes as
          evidence arrives.
        relationship: "Learning revises representations and interactions; their structure also changes which updates are possible."
        url: "/research/learning-system-design/"
        link_text: "Explore learning dynamics"
    evidence:
      id: "evidence"
      label: "Evidence"
      cue: "Create and acquire what matters"
      definition: >-
        Choose observations, perturbations and experiments that can distinguish competing explanations and
        change the next learning step.
      url: "/research/evidence-engineering/"
      link_text: "Explore evidence engineering"
    aims:
      - id: "mechanism"
        label: "Mechanism"
        cue: "An explanation to challenge"
        definition: >-
          Seek explanations with consequences that can be tested against alternatives. A model pattern alone
          does not establish a mechanism.
        url: "/research/mathematical-frontiers/"
        link_text: "Explore what evidence can establish"
      - id: "design"
        label: "Design"
        cue: "A proposal to test"
        definition: >-
          Propose candidates or interventions under scientific constraints, then use new evidence to test
          whether they achieve the intended effect.
        url: "/research/evidence-engineering/"
        link_text: "Explore discovery and design"
    feedback: >-
      Tests of proposed mechanisms and designs return new evidence, revised questions and constraints to
      the learner.
  evidence_loop:
    introduction: "A shared way to reason about discovery."
    reading_note: "Projects may revisit or combine steps; new evidence can change any earlier choice."
    feedback_title: "New evidence changes the next question."
    feedback: >-
      Observations, failed tests and revised constraints return to the learner. Revisit the question,
      evidence choice or model when an explanation no longer holds.
    steps:
      - id: "observe"
        title: "Observe"
        summary: "Establish what is known and uncertain."
        explanation: >-
          Bring measurements into context, including how they were obtained, what they cover and where they
          may be unreliable.
        question: "Which observations are comparable, and what is still missing?"
        artifact: "Context-aware observations with uncertainty and source information."
        pillars:
          - "pillar-ii"
          - "pillar-iii"
      - id: "question"
        title: "Question"
        summary: "Make competing explanations explicit."
        explanation: >-
          Identify a scientific distinction that matters, then ask which alternative structures or mechanisms
          could explain the same observations.
        question: "Could a different interaction or mechanism produce the same pattern?"
        artifact: "Competing explanations and their distinguishable consequences."
        pillars:
          - "pillar-i"
          - "pillar-iii"
      - id: "design-evidence"
        title: "Design evidence"
        summary: "Choose what could distinguish the alternatives."
        explanation: >-
          Select a measurement, perturbation or candidate for what it can reveal, within the available
          scientific and practical constraints.
        question: "Which next experiment would best separate these explanations?"
        artifact: "An evidence-acquisition or experiment-design proposal."
        pillars:
          - "pillar-ii"
          - "pillar-iii"
      - id: "learn"
        title: "Learn"
        summary: "Update the system from the new evidence."
        explanation: >-
          Revise the learning system while examining stability, uncertainty and
          the alternatives that remain unresolved.
        question: "What should change in the learner after this observation?"
        artifact: "A revised model with explicit assumptions and uncertainty."
        pillars:
          - "pillar-i"
          - "pillar-ii"
      - id: "test"
        title: "Test"
        summary: "Challenge predictions and explanations."
        explanation: >-
          Use controls, new conditions and independent evidence where available to probe whether an
          explanation survives plausible alternatives.
        question: "Does the explanation survive matched controls and changed conditions?"
        artifact: "A comparison showing supported claims, failures and limits."
        pillars:
          - "pillar-ii"
          - "pillar-iii"
      - id: "explain-design"
        title: "Explain or design"
        summary: "State what is supported and what to test next."
        explanation: >-
          Form a testable explanation or a constrained design proposal. Keep the conditions and limits
          visible; a prediction alone does not establish a mechanism or a successful design.
        question: "What consequence or design choice could be tested next?"
        artifact: "A testable explanation or design proposal with stated limits."
        pillars:
          - "pillar-i"
          - "pillar-ii"
          - "pillar-iii"
  pillars:
    pillar-i:
      home_invitation: "Learn the right scientific structure"
      home_terms:
        - "Representation"
        - "Interaction"
        - "Learning dynamics"
      role: "The scientific learner"
      title: "Foundational Scientific Learning-System Design"
      question: "How should a scientific system learn?"
    pillar-ii:
      home_invitation: "Create evidence that changes what can be learned"
      home_terms:
        - "Active acquisition"
        - "Perturbation"
        - "Closed loops"
      role: "The evidence environment"
      title: "Evidence Engineering and Closed-Loop Discovery & Design"
      question: "What evidence should the system create next?"
    pillar-iii:
      home_invitation: "Turn patterns into principles and possibilities"
      home_terms:
        - "Identifiability"
        - "Uncertainty"
        - "Inverse design"
      role: "The mathematical lens"
      title: "Mathematical Data Science and Frontier Exploration"
      question: >-
        What mathematical and data-science methods can reveal important structure and open new scientific
        possibilities?
  people_introduction: >-
    Our team works across biomedical engineering, pharmacy, chemistry, materials, and machine learning.
    Individual profiles document each researcher’s current role, training, and research interests.

# Figure prose; diagram labels/calculations are generated by scripts/render-interaction-structure.py.
research_figures:
  interaction_structure:
    title: Same units. Different relationships.
    introduction: A representation must preserve the distinctions the scientific question depends on. In this
      small example, the feature values stay fixed while the connections change.
    alt: Both graphs contain feature values 1, 2, 3 and 4, with mean 2.5. Graph A connects 1 to 2 and 3 to
      4; Graph B connects 1 to 3 and 2 to 4. Adding the products along their connections gives 14 for A and
      11 for B.
    caption: Illustrative calculation, not measured data or a proposed model. Averaging these input features
      ignores the connections. A relation-dependent calculation can retain this particular distinction; it
      does not by itself establish a physical interaction or a mechanism.
    explanation_label: Read the calculation and its limits
    units: Each numbered node is an information unit carrying one scalar feature. Lines specify pairs in the
      example; their position and length have no physical meaning.
    limits: The example motivates designing which units interact and how their information is combined. It
      does not show that every graph can be distinguished this way, or that pooling after an interaction-aware
      update necessarily loses this information.
    download_label: 'View full-size diagram:'
    wide_label: Wide layout
    vertical_label: Vertical layout
    calculations:
    - label: 'Feature mean, both graphs:'
      expression: (1 + 2 + 3 + 4) / 4 = 2.5.
    - label: 'Graph A, sum of connected-pair products:'
      expression: (1 × 2) + (3 × 4) = 14.
    - label: 'Graph B, sum of connected-pair products:'
      expression: (1 × 3) + (2 × 4) = 11.
