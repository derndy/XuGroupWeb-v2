home:
  hero:
    eyebrow: "Scientific learning · Evidence engineering · Mathematical data science"
    title: "Designing Scientific Learning and Discovery Systems"
    subtitle: >-
      We design how scientific systems represent information, organize interactions, learn from evidence,
      and generate new knowledge and designs.
    actions_label: "Primary actions"
    research_link: "Explore our research"
    testbeds_link: "Scientific testbeds"
    tagline: "Learn better. Create better evidence. Discover deeper. Design forward."
  map:
    title: "One connected scientific system"
    hint: "Open a concept to explore its role."
    evidence_relation: "Evidence informs the learner; the learner helps choose new evidence."
    learner_label: "Design the learner together"
    co_design: "Each choice changes what the others can express, combine and learn."
    aims_label: "Research aims to test against evidence"
  thesis:
    eyebrow: "01 · Research thesis"
    title: "Beyond prediction: toward testable mechanisms"
    paragraph_one: >-
      Prediction asks what may happen. Scientific discovery asks what structure, interaction, or mechanism
      makes it happen—and what evidence would distinguish that explanation from alternatives.
    paragraph_two: >-
      We develop intelligent computational frameworks to discover hidden principles governing molecular
      and material behaviours. This systems perspective connects with AI for Science, scientific foundation
      models and generative design.
    link: "About our approach"
  vision:
    eyebrow: "Our vision"
    title: "Understanding the World. Pioneering the Future."
    introduction: >-
      We seek to deepen our understanding of the world, recognise questions of growing importance,
      and cultivate researchers who can lead the future of their fields.
    perspectives:
      - title: "Scientific foresight"
        description: >-
          We look for early signals of change, connect developments across fields, see the structures
          behind phenomena, and question assumptions that limit our thinking. Our horizon spans decades and,
          where meaningful, centuries. What problems and constraints will become important?
          What knowledge could open new directions?
      - title: "Evidence and intellectual leadership"
        description: >-
          We follow evidence in pursuit of reality and truth, remaining ready to revise our understanding.
          Thinking about the future means stating assumptions and turning them into questions we can
          investigate today. Intellectual leadership grows from worthwhile questions and rigorous understanding.
    architects:
      title: "Cultivating domain intelligence system architects"
      introduction: >-
        One path is to cultivate domain intelligence system architects: researchers who connect model
        architecture, infrastructure, and the design of scientific and intelligent systems. Starting with
        worthwhile problems, they define objective functions (what to optimise), search spaces
        (what possibilities to explore), and evaluation criteria (how to judge progress).
      outlook: >-
        For example, asking how much effective intelligence can be produced per unit of energy could open
        a new direction in energy-efficient intelligence. Our vision leaves room for important problems
        and research methods that have yet to emerge.
  grammar:
    eyebrow: "02 · Space · Interaction · Learning"
    title: "Scientific intelligence is a designed system."
    introduction: >-
      Representation, interaction and learning are connected design choices within the scientific learner.
      We study how they shape one another, alongside evidence creation and mathematical questions.
    connected_choice_label: "Connected choice:"
    feedback_title: "Evidence keeps the system open to revision."
  pillars:
    eyebrow: "03 · Research system"
    title: "Three contributions. One discovery system."
    introduction: >-
      Each pillar plays a different role: designing the learner, designing the evidence it receives, and
      opening the mathematical frontier of what can be identified and designed.
    link: "Enter the research system"
    pillar_label: "Pillar"
    capabilities_label: "capabilities"
    explore_label: "Explore Pillar"
  evidence_loop:
    eyebrow: "04 · Evidence loop"
    title: "Discovery advances when evidence changes the next question."
    introduction: >-
      We connect learning and experimentation by asking what evidence could change an explanation, a model
      or a design decision.
    type_label: "Conceptual framework"
    hint: "Open a step for an example question and the research behind it."
    question_label: "Example question"
    output_label: "Typical research output"
    contributions_label: "Contributing research"
    return_label: "Return to Observe"
    legend: "Solid arrows follow the reading sequence. The dashed path returns evidence to the next question."
  testbeds:
    eyebrow: "05 · Scientific testbeds"
    title: "Real-world systems for testing scientific learning"
    introduction: >-
      Applications connect our research. They are demanding testbeds in which representations, evidence
      strategies, and mechanisms must work together.
    items:
      - title: "Molecular interactions"
        description: "Drug discovery and mechanism-aware interaction modelling."
      - title: "Proteins and sequences"
